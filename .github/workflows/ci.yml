# Lint, test, and build on every push and pull request.
#
# The build step runs tsc before vite, so a type error fails CI the same
# way it fails a local `npm run build`. Tests run with the CI reporter so
# a failure is readable in the log without scrolling.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --run

      - run: npm run build
